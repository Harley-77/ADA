<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestão bancária">
    <meta name="keywords" content="cadastro,bancário,sistema">
    <title>Projeto - Sistema Bancário</title>
    <script defer src="js/api.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/validacao.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>SISTEMA BANCÁRIO</h1>
    </header>
    <nav>
    </nav>
    <main>
        <section id="titulo">
            <h1>Gestão de Clientes</h1>
        </section>
        <section id="tabela">
            <div>
                <h2>Clientes Cadastrados</h2>
            </div>
        </section>
        <section id="formularios">
            <div id="criar">
                <h2>Cadastrar Cliente</h2>
            </div>
            <form id="form">
                <label for="nome">Nome do Cliente</label>
                <input type="text" id="nome" placeholder="Nome" required>
                <label for="cpf">CPF do Cliente</label>
                <input type="text" id="cpf" placeholder="CPF" required>
                <label for="email">E-mail de contato</label>
                <input type="email" id="email" placeholder="email" required>
                <button type="submit" id="btn-adiciona">Cadastrar Cliente</button>

            </form>
            <div id="editar">

            </div>
            <div id="deletar">

            </div>
            <div id="validar">

            </div>
        </section>
        
    </main>
    <footer>
        <p>Copyright - CAIXAVerso ADA Turma 1727</p>
    </footer>
</body>
</html>
